version: "3.8"

networks:
  tirgannet_network:
    driver: bridge

volumes:
  mysql-data:
    driver: local

  pma-data:
    driver: local

services:
  mysql:
    image: "${MYSQL_IMG}"
    container_name: "${MYSQL_CONTAINER_NAME}"
    restart: "${MYSQL_RESTART_MODE}"
    tty: true

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD}"
    ports:
      - "${MYSQL_PORT}:80"
    volumes:
      - "mysql-data:/var/lib/mysql"
    networks:
      - tirgannet_network

  phpmyadmin:
    image: "${PMA_IMG}"
    container_name: "${PMA_CONTAINER_NAME}"
    
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      PMA_HOST: "${PMA_HOST}"
      PMA_MYSQL_PORT: "${MYSQL_PORT}"
      PMA_UI_PORT: "${PMA_UI_PORT}"

    restart: "${PMA_RESTART_MODE}"

    depends_on:
      - mysql

    ports:
      - "${PMA_UI_PORT}:80"
    volumes:
      - "pma-data:/etc/phpmyadmin/config.user.inc.php"
    networks:
      - tirgannet_network
    links:
      - mysql
