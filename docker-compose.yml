version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - tirgannet_network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: comment-system
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    ports:
      - "3306"   # بیرون روی 3307، داخل کانتینر روی 3306
    networks:
      - tirgannet_network
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - tirgannet_network
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf   # مسیر درست از روت پروژه
    networks:
      - tirgannet_network
    depends_on:
      - app

networks:
  tirgannet_network:
    driver: bridge

volumes:
  mysql_data:
